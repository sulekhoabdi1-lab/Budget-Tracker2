
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Budget Tracker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="heading-card">
        <h1>My Budget Tracker</h1>
        <p>Manage your money. Plan your future.</p>
    </header>

    <main class="container">

        <section class="summary">
            <div class="summary-card">
                <h3>Total Budget</h3>
                <p>$2,000.00</p>
            </div>

            <div class="summary-card">
                <h3>Total Expenses</h3>
                <p>$0.00</p>
            </div>

            <div class="summary-card">
                <h3>Balance</h3>
                <p>$2,000.00</p>
            </div>
        </section>

        <section class="card">
            <h2>Add Expense</h2>

            <form>
                <label for="expense">Expense Name</label>
                <input type="text" id="expense" placeholder="Enter expense name">

                <label for="amount">Amount ($)</label>
                <input type="number" id="amount" placeholder="Enter amount">

                <label for="category">Category</label>
                <select id="category">
                    <option value="">Select category</option>
                    <option>Food</option>
                    <option>Transport</option>
                    <option>Shopping</option>
                    <option>Bills</option>
                    <option>Other</option>
                </select>

                <label for="date">Date</label>
                <input type="date" id="date">

                <button type="button">Add Expense</button>
            </form>
        </section>

        <section class="card">
            <h2>Expense History</h2>

            <table>
                <thead>
                    <tr>
                        <th>Expense</th>
                        <th>Category</th>
                        <th>Amount</th>
                        <th>Date</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>Example: Food</td>
                        <td>Food</td>
                        <td>$20.00</td>
                        <td>2026-11-12</td>
                    </tr>
                </tbody>
            </table>
        </section>

    </main>

    <footer>
        <p>Budget Tracker Project | 2026</p>
    </footer>

</body>
</html>
